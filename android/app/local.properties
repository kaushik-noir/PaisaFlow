/**
 * Secondary full-screen routes layered over the tab shell.
 * "No route" is now an empty back stack, so the old NONE entry is gone.
 */
enum class Route { EVIDENCE, MEMORY, KHATA, ALERTS, PROFILE }

/** Survives rotation and process death: the stack is stored as enum names. */
private val RouteStackSaver = listSaver<List<Route>, String>(
    save = { stack -> stack.map { it.name } },
    restore = { names -> names.map(Route::valueOf) },
)

/** Demo / placeholder copy kept in one place until it moves into the i18n layer. */
private object DemoText {
    const val CORRECTION = "Badalna hai — correction event"
    const val LISTENING = "🎙️ Boliye…"
    const val READING_SCREEN = "Screen ko padh kar sunaa raha hoon…"
    const val KHATA_TRANSCRIPT = "Ramesh ko ₹850 ka maal diya"
}

/** Splash → (Language → Onboarding on first run) → tab shell + routes, under one app-wide language. */
@Composable
fun PaisaFlowApp() {
    // Application context: Prefs must never hold on to the Activity.
    val appContext = LocalContext.current.applicationContext
    val prefs = remember(appContext) { Prefs(appContext) }

    var language by rememberSaveable { mutableStateOf(prefs.language) }
    var splashDone by rememberSaveable { mutableStateOf(false) }
    var onboarded by rememberSaveable { mutableStateOf(prefs.onboarded) }
    var langChosen by rememberSaveable { mutableStateOf(prefs.onboarded) }
    var tab by rememberSaveable { mutableStateOf(AppTab.HOME) }
    var routeStack by rememberSaveable(stateSaver = RouteStackSaver) { mutableStateOf(emptyList<Route>()) }

    // Keeps each tab's rememberSaveable state (scroll, inputs…) alive across tab switches and route visits.
    val tabStateHolder = rememberSaveableStateHolder()

    val snackbar = remember { SnackbarHostState() }
    val scope = rememberCoroutineScope()
    val toast: (String) -> Unit = remember(scope, snackbar) {
        { msg: String ->
            scope.launch {
                snackbar.currentSnackbarData?.dismiss()
                snackbar.showSnackbar(msg)
            }
            Unit
        }
    }

    fun setLanguage(l: AppLanguage) { language = l; prefs.language = l }
    fun cycleLanguage() { val next = language.next(); setLanguage(next); toast(next.native) }
    fun finishOnboarding() { onboarded = true; prefs.onboarded = true; tab = AppTab.TALK }

    fun openRoute(r: Route) { if (routeStack.lastOrNull() != r) routeStack = routeStack + r }
    fun popRoute() { routeStack = routeStack.dropLast(1) }
    fun goToTab(t: AppTab) { routeStack = emptyList(); tab = t }

    val currentRoute = routeStack.lastOrNull()
    val inTabShell = splashDone && langChosen && onboarded && currentRoute == null

    CompositionLocalProvider(LocalAppLanguage provides language) {
        Box(Modifier.fillMaxSize()) {
            when {
                !splashDone -> SplashScreen { splashDone = true }

                !langChosen -> LanguageScreen(language, ::setLanguage) { langChosen = true }

                !onboarded -> {
                    // Back from onboarding returns to the language picker instead of closing the app.
                    BackHandler { langChosen = false }
                    OnboardingScreen(
                        onSpeak = { finishOnboarding() },
                        onSubmitText = { finishOnboarding(); toast(it) },
                    )
                }

                currentRoute != null -> RouteHost(
                    route = currentRoute,
                    language = language,
                    onBack = ::popRoute,
                    onOpenRoute = ::openRoute,
                    onGoToTab = ::goToTab,
                    onCycleLanguage = ::cycleLanguage,
                    toast = toast,
                )

                else -> TabShell(
                    tab = tab,
                    language = language,
                    snackbar = snackbar,
                    stateHolder = tabStateHolder,
                    onSelectTab = { tab = it },
                    onOpenRoute = ::openRoute,
                    onSetLanguage = ::setLanguage,
                    onCycleLanguage = ::cycleLanguage,
                    toast = toast,
                )
            }

            // Outside the tab shell there is no Scaffold, so toasts need their own host to be visible.
            if (!inTabShell) {
                SnackbarHost(
                    hostState = snackbar,
                    modifier = Modifier.align(Alignment.BottomCenter).navigationBarsPadding(),
                )
            }
        }
    }
}

/** Full-screen secondary routes. Back pops one level, so Profile → Memory → back lands on Profile. */
@Composable
private fun RouteHost(
    route: Route,
    language: AppLanguage,
    onBack: () -> Unit,
    onOpenRoute: (Route) -> Unit,
    onGoToTab: (AppTab) -> Unit,
    onCycleLanguage: () -> Unit,
    toast: (String) -> Unit,
) {
    BackHandler(onBack = onBack)
    when (route) {
        Route.EVIDENCE -> EvidenceModeScreen(
            onBack = onBack,
            onSpeak = { onGoToTab(AppTab.TALK) },
            onToast = toast,
        )
        Route.MEMORY -> MemoryScreen(
            onBack = onBack,
            onCorrect = { toast(DemoText.CORRECTION) },
        )
        Route.KHATA -> VoiceKhataScreen(
            onBack = onBack,
            onSpeak = { toast(DemoText.LISTENING) },
            transcript = DemoText.KHATA_TRANSCRIPT,
            onToast = toast,
        )
        Route.ALERTS -> AlertsScreen(
            onBack = onBack,
            onView = { onGoToTab(AppTab.KHATA) },
            onToast = toast,
        )
        Route.PROFILE -> ProfileScreen(
            language,
            onBack = onBack,
            onOpenMemory = { onOpenRoute(Route.MEMORY) },
            onOpenAlerts = { onOpenRoute(Route.ALERTS) },
            onLanguage = onCycleLanguage,
            onToast = toast,
        )
    }
}

/** Bottom-nav shell: top bar + five tabs. */
@Composable
private fun TabShell(
    tab: AppTab,
    language: AppLanguage,
    snackbar: SnackbarHostState,
    stateHolder: SaveableStateHolder,
    onSelectTab: (AppTab) -> Unit,
    onOpenRoute: (Route) -> Unit,
    onSetLanguage: (AppLanguage) -> Unit,
    onCycleLanguage: () -> Unit,
    toast: (String) -> Unit,
) {
    // Back on any other tab returns to Home first; back on Home exits as usual.
    BackHandler(enabled = tab != AppTab.HOME) { onSelectTab(AppTab.HOME) }

    // Hindi Home (v2 mockup) has its own brand bar; other languages use the v1 Home under the global top bar.
    val hindiHome = tab == AppTab.HOME && language == AppLanguage.HI

    Scaffold(
        containerColor = PfColors.Surface,
        topBar = {
            if (!hindiHome) AppTopBar(
                businessLabel = DemoHome.data.businessLabel,
                language = language,
                onLanguageClick = onCycleLanguage,
                onSpeakClick = { toast(DemoText.READING_SCREEN) },
                onProfileClick = { onOpenRoute(Route.PROFILE) },
            )
        },
        bottomBar = { AppBottomNav(current = tab, onSelect = onSelectTab) },
        snackbarHost = { SnackbarHost(snackbar) },
    ) { padding ->
        Box(Modifier.fillMaxSize().padding(padding)) {
            stateHolder.SaveableStateProvider(tab) {
                when (tab) {
                    AppTab.HOME -> if (hindiHome) HomeHindiScreen(
                        onSpeak = { onSelectTab(AppTab.TALK) },
                        onOpenSimulation = { onSelectTab(AppTab.WHAT_IF) },
                        onOpenActions = { onSelectTab(AppTab.KHATA) },
                        onToggleLanguage = onCycleLanguage,
                        onToast = toast,
                    ) else HomeScreen(
                        onSpeak = { onSelectTab(AppTab.TALK) },
                        onOpenActions = { onSelectTab(AppTab.KHATA) },
                        onOpenTwin = { onSelectTab(AppTab.TWIN) },
                        onToast = toast,
                    )
                    AppTab.TALK -> VoiceConversationScreen(
                        onToast = toast,
                        onExplain = { onOpenRoute(Route.EVIDENCE) },
                        language = language,
                        onLanguage = onSetLanguage,
                    )
                    AppTab.TWIN -> TwinScreen(
                        onOpenMemory = { onOpenRoute(Route.MEMORY) },
                        onRunWhatIf = { onSelectTab(AppTab.WHAT_IF) },
                    )
                    AppTab.WHAT_IF -> SimulateScreen(
                        onSpeak = { onSelectTab(AppTab.TALK) },
                        onExplain = { onOpenRoute(Route.EVIDENCE) },
                        onToast = toast,
                    )
                    AppTab.KHATA -> ActionsScreen(
                        onSpeak = { onOpenRoute(Route.KHATA) },
                        onOpenWhatIf = { onSelectTab(AppTab.WHAT_IF) },
                        onToast = toast,
                    )
                }
            }
        }
    }
}


