<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    xmlns:tools="http://schemas.android.com/tools">

    <!-- API calls to the PaisaFlow backend -->
    <uses-permission android:name="android.permission.INTERNET" />
    <!-- Voice input (speech-to-text plugs in next phase) -->
    <uses-permission android:name="android.permission.RECORD_AUDIO" />
    <!-- Fingerprint / device-credential unlock (RULES.md §18 shared-phone mitigation) -->
    <uses-permission android:name="android.permission.USE_BIOMETRIC" />

    <!-- Voice and fingerprint are optional: the app must still install on phones without them -->
    <uses-feature android:name="android.hardware.microphone" android:required="false" />
    <uses-feature android:name="android.hardware.fingerprint" android:required="false" />

    <!-- allowBackup is off: khata / business data must not leak through cloud or adb backups
         (shared-phone risk, RULES.md §18). Cleartext traffic is NOT enabled here; the local
         dev backend is allowed only by src/debug/AndroidManifest.xml (RULES.md §15). -->
    <application
        android:allowBackup="false"
        android:icon="@mipmap/ic_launcher"
        android:label="@string/app_name"
        android:supportsRtl="true"
        android:theme="@style/Theme.PaisaFlow"
        tools:targetApi="34">

        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:theme="@style/Theme.PaisaFlow"
            android:windowSoftInputMode="adjustResize">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>


